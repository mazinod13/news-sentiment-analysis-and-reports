# docker compose up -d            postgres + schema migration + continuous worker
# docker compose run --rm app python -m app.main <command>     one-off CLI
# docker compose run --rm test                                 test suite
name: ${COMPOSE_PROJECT_NAME:-news-sentiment}

x-app: &app
  build:
    context: .
    target: runtime
  image: news-sentiment:latest
  init: true            # PID 1 that forwards SIGTERM, so `stop` is immediate
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-news}:${POSTGRES_PASSWORD:-news}@postgres:5432/${POSTGRES_DB:-news_sentiment}
  volumes:
    # Source and selector YAML are mounted read-only, so adding or fixing an
    # outlet takes effect on the next cycle without rebuilding the image.
    - ./config:/app/config:ro
    # Export target for CLI output, e.g. `bipad --out data/incidents.csv`.
    - ./data:/app/data

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-news}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-news}
      POSTGRES_DB: ${POSTGRES_DB:-news_sentiment}
    ports:
      # Loopback only -- the database is never exposed beyond this machine.
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-news} -d ${POSTGRES_DB:-news_sentiment}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Creates any missing tables, then exits. Everything that needs the
  # database waits for it to finish successfully.
  migrate:
    <<: *app
    command: ["python", "-m", "app.main", "db", "upgrade"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  # Continuous, priority-driven scheduler.
  worker:
    <<: *app
    command: ["python", "-m", "app.main", "worker"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

  # One-off CLI runner; never started by `up`.
  app:
    <<: *app
    profiles: ["cli"]
    command: ["python", "-m", "app.main", "--help"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Offline test suite; needs no database.
  test:
    build:
      context: .
      target: test
    image: news-sentiment:test
    profiles: ["test"]
    command: ["pytest"]

volumes:
  pgdata:
