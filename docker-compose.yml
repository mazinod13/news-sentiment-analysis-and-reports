# One container against your own MySQL 8 server:
#
#   cp .env.example .env     # put the database credentials in it
#   docker compose up -d     # that is the whole deployment
#
# The worker waits for the database, creates missing tables, grades and groups
# whatever is pending, then polls on schedule. Nothing to run by hand.
#
#   docker compose run --rm app python -m app.main stories --hours 24
#   docker compose run --rm test
name: ${COMPOSE_PROJECT_NAME:-news-sentiment}

x-app: &app
  build:
    context: .
    target: runtime
  image: news-sentiment:latest
  init: true            # PID 1 that forwards SIGTERM, so `stop` is immediate
  env_file:
    - path: .env
      required: false
  volumes:
    # Source and selector YAML are mounted read-only, so adding or fixing an
    # outlet takes effect on the next cycle without rebuilding the image.
    - ./config:/app/config:ro
    # Export target for CLI output, e.g. `bipad --out data/incidents.csv`.
    - ./data:/app/data
  logging:
    driver: json-file
    options:
      # A small VM must not fill its disk with logs.
      max-size: "10m"
      max-file: "3"

services:
  worker:
    <<: *app
    container_name: ${COMPOSE_PROJECT_NAME:-news-sentiment}-worker
    command: ["python", "-m", "app.main", "worker"]
    restart: unless-stopped
    # Let a long cycle finish on `docker stop` instead of being killed mid-write.
    stop_grace_period: 2m
    # Green/red in Portainer. The worker only beats after work succeeds, so a
    # worker that cannot reach the database goes red instead of looking idle.
    healthcheck:
      test: ["CMD", "python", "-m", "app.main", "health"]
      interval: 5m
      timeout: 30s
      start_period: 10m
      retries: 2
    mem_limit: ${WORKER_MEMORY:-512m}
    cpus: ${WORKER_CPUS:-1.0}

  # Read-only HTTP API over the stored corpus.
  # Published on loopback by default: put a reverse proxy with TLS in front, or
  # set API_BIND=0.0.0.0 to expose it directly.
  api:
    <<: *app
    container_name: ${COMPOSE_PROJECT_NAME:-news-sentiment}-api
    command: ["python", "-m", "app.main", "api", "--host", "0.0.0.0"]
    restart: unless-stopped
    ports:
      - "${API_BIND:-127.0.0.1}:${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5)"]
      interval: 1m
      timeout: 10s
      start_period: 30s
      retries: 3
    mem_limit: ${API_MEMORY:-256m}
    cpus: ${API_CPUS:-0.5}

  # One-off CLI; never started by `up`.
  #   docker compose run --rm app python -m app.main sources
  app:
    <<: *app
    profiles: ["cli"]
    command: ["python", "-m", "app.main", "--help"]

  # Offline test suite; needs no database.
  #   docker compose run --rm test
  test:
    build:
      context: .
      target: test
    image: news-sentiment:test
    profiles: ["test"]
    command: ["pytest"]

  # Development only: a throwaway local database, never started by `up`.
  #   docker compose --profile local-db up -d mysql
  # Then set MYSQL_HOST=mysql in .env (or 127.0.0.1 from the host), and
  # MYSQL_SSLMODE=disable -- a local container needs no TLS.
  mysql:
    image: mysql:8.4
    profiles: ["local-db"]
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-news}
      MYSQL_USER: ${MYSQL_USER:-news}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-news}
      MYSQL_DATABASE: ${MYSQL_DB:-news_sentiment}
    # utf8mb4 everywhere, or Devanagari does not survive the round trip.
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysqldata:/var/lib/mysql

volumes:
  mysqldata:
