[project]
name = "news-sentiment"
version = "0.1.0"
description = "Scraping, sentiment analysis and reporting over Nepali news sources"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "certifi>=2024.7.4",
    "feedparser>=6.0.11",
    "selectolax>=0.3.21",
    "PyYAML>=6.0",
    "python-dateutil>=2.9",
    "nepali-datetime>=1.0.8",
    "SQLAlchemy>=2.0.30",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# No -q here: it decrements verbosity, so `pytest -v` would cancel out to the
# default and silently not list test names. Pass -q or -v per run instead.
addopts = ""
# Makes `pytest` work straight from a clone. Without it only `python -m pytest`
# works (it adds the CWD to sys.path; the `pytest` console script does not),
# and `import app` fails while loading tests/conftest.py.
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# UP017 rewrites `timezone.utc` to `datetime.UTC`, which is 3.11+ only. Both
# spellings are current and non-deprecated, and the portable one keeps the code
# runnable on 3.10 while the supported floor is still being settled.
ignore = ["UP017"]
