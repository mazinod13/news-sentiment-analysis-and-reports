# Selector pack for Himalpress-sudurpaschim article pages.
# Syntax: a CSS selector, optionally suffixed with @attribute.
#   "p.date span"                        -> text of the first match
#   "meta[property='og:image']@content"  -> that attribute
# Verify against tests/fixtures/himalpress-province-7_story.html before committing.

article:
  body: "div.content-area"
  author: "div.news--author@directtext"
  published: "div.news--author span.post-hour"
  published_format: auto
  image: "meta[property='og:image']@content"

exclude:
  - "script"
  - "style"
  - "aside"
  # - ads, related-story rails, poll widgets, share bars...
