# Selector pack for The Rising Nepal article pages.
# Syntax: a CSS selector, optionally suffixed with @attribute.
#   "p.date span"                        -> text of the first match
#   "meta[property='og:image']@content"  -> that attribute
# Verify against tests/fixtures/risingnepal_story.html before committing.

article:
  title: "h1.single-top-title.sticky-title"
  body: "div.single-blog-box-layout3 > div.rising-single-box-one > div:nth-child(4)"                # container holding the article paragraphs
  author: "p:nth-child(1) > b"
  published: "span.mr-3.font-size-16"
  # bs = Bikram Sambat in Devanagari, iso = machine-readable, auto = try both
  published_format: auto
  image: "meta[property='og:image']@content"

exclude:
  - "script"
  - "style"
  - "aside"
  # - ads, related-story rails, poll widgets, share bars...
