# Selector pack for Image Channel article pages.
# Syntax: a CSS selector, optionally suffixed with @attribute.
#   "p.date span"                        -> text of the first match
#   "meta[property='og:image']@content"  -> that attribute
# Verify against tests/fixtures/imagechannel_story.html before committing.

article:
  title: "h1"
  body: "article.post-entry.uk-text-center"                # container holding the article paragraphs
  author: "a.uk-link-reset.uk-margin-left.uk-margin-right"
  published: "p.single-date"
  # bs = Bikram Sambat in Devanagari, iso = machine-readable, auto = try both
  published_format: auto
  image: "meta[property='og:image']@content"

exclude:
  - "script"
  - "style"
  - "aside"
  # - ads, related-story rails, poll widgets, share bars...
