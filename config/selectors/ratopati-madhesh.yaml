# Selector pack for ratopati-madhesh article pages.
# Syntax: a CSS selector, optionally suffixed with @attribute.
#   "p.date span"                        -> text of the first match
#   "meta[property='og:image']@content"  -> that attribute
# Verify against tests/fixtures/ratopati-madhesh_story.html before committing.
listing:
  item: "div.columnnews, div.thumbnail-news, div.overlay-news"
  link: "a[href*='/story/']@href"
  title: ".news-title"
article:
  body: "div.the-content p"               # container holding the article paragraphs
  author: "div.news-container div.user a"
  published: "div.news-container div.post-hour > span"
  # bs = Bikram Sambat in Devanagari, iso = machine-readable, auto = try both
  published_format: bs
  image: "meta[property='og:image']@content"

exclude:
  - "script"
  - "style"
  - "aside"
  # - ads, related-story rails, poll widgets, share bars...
