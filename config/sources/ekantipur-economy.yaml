notes: |
  - No RSS anywhere on eKantipur: /business/rss and /business/feed return 200
    text/html. The section listing is the item source.
  - Same card markup as the province pages. Cards carry no date; author and a
    full timestamp come from the article's JSON-LD.
  - LIMITATION, same as every eKantipur source: article bodies are rendered
    client-side, so `body` is the lede only (~120 chars).
  - A separate बजार nav section (/market) exists; not added.
