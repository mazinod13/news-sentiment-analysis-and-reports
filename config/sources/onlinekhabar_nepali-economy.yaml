    reach back three months), so the wider feed is used.
  - KNOWN LIMITATION, inherited from the onlinekhabar_nepali pack: the body
    starts with the "News Summary / Generated by OK AI" block and ends with a
    "यो पनि पढ्नुहोस" link. Excluding .ai_summary_block and
    [class*=ok-also-read] in that pack fixes both, for both sources.
